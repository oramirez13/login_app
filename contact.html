<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>login_app</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="static/css/style.css" />
  </head>
  <body>
    <!-- main navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <!-- brand text with the icon on the LEFT -->
        <a class="navbar-brand" href="index.html">
          <img
            src="static/img/infosec_orami_.png"
            alt="Logo"
            style="height: 30px"
          />
          ORAMI
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" href="index.html">Home</a>
            <a class="nav-item nav-link" href="blog.html">Blog</a>
            <a class="nav-item nav-link" href="about.html">About</a>
            <a class="nav-item nav-link active" href="contact.html">Contact</a>
            <a class="nav-item nav-link" href="search.html">Search</a>
          </div>

          <!-- logout button -->
          <a href="index.html" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <!-- main container -->
    <div class="container mt-5 text-center">
      <h1>Contact</h1>
      <p>Communication channels</p>
      <h2>Write to us</h2>

      <!-- visual-only form -->
      <form id="contactForm">
        <div class="form-group">
          <label>Name:</label>
          <input type="text" id="name" class="form-control" required />
        </div>

        <div class="form-group">
          <label>Message:</label>
          <textarea id="message" class="form-control" rows="3"></textarea>
          <p>Total characters: <span id="counter">0</span></p>
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>

      <!-- demo notice -->
      <div class="alert alert-warning mt-4">
        <strong>Visual demo:</strong> The form is not connected to a server in
        this static version.
      </div>
    </div>

    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>
    <script src="static/js/script.js"></script>
  </body>
</html>
