<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>login_app</title>

    <!-- Bootstrap/css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
      crossorigin="anonymous"
    />

    <!-- css/style.css -->
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <!-- main navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <!-- brand text with the icon on the LEFT -->
        <a class="navbar-brand" href="/">
          <img
            src="/static/img/infosec_orami_.png"
            alt="Logo"
            style="height: 30px"
          />
          ORAMI
        </a>

        <!-- hamburger button for mobile devices -->
        <button
          class="navbar-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#menuPrincipal"
          aria-controls="menuPrincipal"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- navigation links -->
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <div class="navbar-nav mr-auto">
            <a class="nav-item nav-link" href="/">Home</a>
            <a class="nav-item nav-link" href="/blog">Blog</a>
            <a class="nav-item nav-link" href="/about">About</a>
            <a class="nav-item nav-link active" href="/contact">Contact</a>
            <a class="nav-item nav-link" href="/search">Search</a>
          </div>

          <!-- logout button -->
          <a href="/logout" class="btn btn-outline-danger btn-sm">Logout</a>
        </div>
      </div>
    </nav>

    <!-- main container -->
    <div class="container mt-5 text-center">
      <h1>Contact</h1>
      <p>Communication channels</p>

      <h2>Write to us</h2>

      <!-- 
        FORM with method POST and action /contact
        Flask receives the data with request.form.get()
        The message field is rendered with |safe -> functional XSS
      -->
      <form
        method="POST"
        action="/contact"
        style="max-width: 460px; margin: 1rem auto; text-align: left"
      >
        <!-- name field -->
        <div class="form-group">
          <label>Name:</label>
          <input type="text" name="name" class="form-control" required />
        </div>

        <!-- message field - vulnerable to XSS -->
        <div class="form-group">
          <label>Message:</label>
          <!-- the content of this field is rendered without escaping -->
          <textarea
            id="message"
            name="message"
            class="form-control"
            rows="3"
          ></textarea>
          <p>Total characters: <span id="counter">0</span></p>
        </div>

        <!-- submit button -->
        <button type="submit" class="btn btn-primary">Send</button>
      </form>

      <!-- server response after the POST -->
      {% if message %}
      <div class="alert alert-info mt-4">
        <h5>Message received:</h5>
        <p><strong>Name:</strong> {{ name }}</p>

        <!-- VULNERABLE XSS: |safe disables the Jinja2 escaping -->
        <!-- payload: <script>alert('XSS')</script> -->
        <p><strong>Message:</strong> {{ message|safe }}</p>
      </div>
      {% endif %}
    </div>

    <!--jQuery-->
    <script
      src="https://code.jquery.com/jquery-3.7.1.js"
      integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
      crossorigin="anonymous"
    ></script>

    <!--Bootstrap/popper-->
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"
      integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
      crossorigin="anonymous"
    ></script>

    <!--Bootstrap/js-->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"
      integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
      crossorigin="anonymous"
    ></script>

    <!-- js/script.js -->
    <script src="/static/js/script.js"></script>
  </body>
</html>
